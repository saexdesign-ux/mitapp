
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Kamera Siswa</title>

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<!-- Teachable Machine -->
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

#status{
    margin:15px 0;
    padding:10px;
    border-radius:10px;
    background:#1e293b;
    font-size:16px;
}

#webcam-container{
    margin-top:20px;
}

canvas{
    width:320px !important;
    height:320px !important;
    border-radius:20px;
    border:4px solid #22c55e;
    background:black;
}

#result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    color:#22c55e;
}

#debug{
    margin-top:15px;
    color:#facc15;
    font-size:14px;
    word-break:break-word;
}

button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>AI Kamera Siswa</h1>

<div id="status">Siap memulai...</div>

<button onclick="startAI()">Aktifkan Kamera</button>

<div id="webcam-container"></div>

<div id="result">Belum ada deteksi</div>

<div id="debug"></div>

</div>

<script>

const MODEL_URL = "https://teachablemachine.withgoogle.com/models/FQRrdIwRj/";

let model;
let webcam;
let running = false;
let lastSent = "";

function setStatus(text){
    document.getElementById("status").innerText = text;
}

function setDebug(text){
    document.getElementById("debug").innerText = text;
}

async function startAI(){

    if(running){
        return;
    }

    try{

        running = true;

        setStatus("Loading AI model...");

        if(typeof tmImage === "undefined"){
            throw new Error("tmImage gagal dimuat");
        }

        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);

        setStatus("Model berhasil dimuat");

        webcam = new tmImage.Webcam(320, 320, true);

        setStatus("Meminta akses kamera...");

        await webcam.setup({
            facingMode: "user"
        });

        await webcam.play();

        const container = document.getElementById("webcam-container");
        container.innerHTML = "";
        container.appendChild(webcam.canvas);

        setStatus("Kamera aktif");

        requestAnimationFrame(loop);

    }catch(err){

        console.error(err);

        setStatus("ERROR");

        setDebug(err.message);

        alert(
            "Terjadi error:\n\n" +
            err.message +
            "\n\nPastikan:\n" +
            "1. Hosting menggunakan HTTPS\n" +
            "2. Kamera diizinkan\n" +
            "3. Browser mendukung kamera\n" +
            "4. Internet aktif"
        );
    }
}

async function loop(){

    if(!running) return;

    webcam.update();

    await predict();

    requestAnimationFrame(loop);
}

async function predict(){

    try{

        const predictions = await model.predict(webcam.canvas);

        let best = predictions[0];

        for(let i=1; i<predictions.length; i++){

            if(predictions[i].probability > best.probability){
                best = predictions[i];
            }
        }

        const label = best.className;
        const confidence = (best.probability * 100).toFixed(1);

        document.getElementById("result").innerHTML =
            label + " (" + confidence + "%)";

        if(best.probability >= 0.90){

            if(lastSent !== label){

                lastSent = label;

                setDebug("Mengirim ke App Inventor: " + label);

                // MIT App Inventor
                if(window.AppInventor){

                    window.AppInventor.setWebViewString(label);
                }

                // Android Debug
                console.log("DATA TERKIRIM:", label);
            }
        }

    }catch(err){

        console.error(err);

        setDebug("Predict Error: " + err.message);
    }
}

window.addEventListener("error", function(e){

    setDebug("Global Error: " + e.message);
});

</script>

</body>
</html>
